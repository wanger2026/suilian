name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: companion/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public source and dependency tools
        run: |
          python tools/check_public_tree.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Test and vet companion
        working-directory: companion
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Compile desktop and test USB helpers
        shell: powershell
        run: |
          & ./tools/build-manager.ps1
          & ./tests/UsbPreflightTests.ps1
          & ./tests/UsbPairFieldsTests.ps1
      # UI/device acceptance is performed locally, not inferred from this job.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fL "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl -fL "$base/gitleaks_8.30.1_checksums.txt" -o /tmp/checksums.txt
          expected=$(awk '$2=="gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' /tmp/checksums.txt)
          test -n "$expected"
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum --check
          mkdir /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin
          /tmp/gitleaks-bin/gitleaks git . --redact --config .gitleaks.toml --no-banner

